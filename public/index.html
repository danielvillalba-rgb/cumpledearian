<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shenlong · Cumple de Arian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="/img/fondo.jpg?v=hd1">
<style>
  :root { --oro: #ffd23f; --naranja: #ff9d00; --verde: #2fbf4a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0a1a3a; color: #fff; overflow: hidden;
    font-family: "Nunito", "Segoe UI", sans-serif;
  }

  /* Fondo difuminado (solo se ve en pantallas angostas) */
  .relleno {
    position: fixed; inset: -40px;
    background: url(/img/fondo.jpg?v=hd1) center / cover;
    filter: blur(28px) brightness(.55) saturate(1.2);
  }

  .marco { position: fixed; inset: 0; display: grid; place-items: center; }

  /* Escena: misma proporción que la imagen (1024 x 434).
     Se agranda todo lo posible recortando cielo a los costados, pero siempre
     deja a la vista la zona del dragón, las 7 esferas y el logo
     (x 290-735 de 1024, o sea el 43,5% central del ancho).
     - Notebook / TV: ocupa toda la pantalla.
     - Celular vertical: la zona del dragón ocupa todo el ancho. */
  .marco { overflow: hidden; }
  .escena {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(235.94vh, 230.1vw); height: min(100vh, 97.53vw);
    container-type: size;
    overflow: hidden;
  }
  /* Celular vertical: título arriba del dragón */
  .titulo-cel { display: none; }
  @media (max-aspect-ratio: 5/8) {
    .titulo-cel {
      display: block; position: fixed; left: 0; right: 0; top: max(56px, calc(50% - 48.8vw - 24vw)); z-index: 3;
      text-align: center; padding: 0 16px;
      font-family: "Bangers", Impact, sans-serif; font-size: 8.5vw; letter-spacing: .3vw; line-height: 1.05;
      color: var(--oro); -webkit-text-stroke: .35vw #8a3000; text-shadow: .6vw .6vw 0 #4a1500;
    }
    .titulo-cel small { display: block; font-family: "Nunito", sans-serif; font-weight: 900; font-size: 4vw; letter-spacing: 0; -webkit-text-stroke: 0; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.6); margin-top: 1.5vw; }
    body .contador { font-size: 7vw; bottom: max(12px, calc(50% - 48.8vw - 16vw)); right: 50%; transform: translateX(50%); }
  }
  .vivo {
    position: absolute; inset: 0;
    animation: respira 9s ease-in-out infinite;
    transform-origin: 50% 40%;
  }
  @keyframes respira {
    0%, 100% { transform: scale(1) translateY(0); }
    50% { transform: scale(1.018) translateY(-.4%); }
  }
  body.ruge .vivo { animation: temblor .5s linear 6, respira 9s ease-in-out 3s infinite; }
  @keyframes temblor {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-.5%, .3%); } 40% { transform: translate(.4%, -.4%); }
    60% { transform: translate(-.3%, -.2%); } 80% { transform: translate(.5%, .3%); }
  }
  .vivo > img.fondo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; }

  /* Energía dorada girando alrededor de Shenlong */
  .energia {
    position: absolute; left: 50%; top: 46%; width: 50%; height: 112%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 10%, rgba(255,220,90,.55) 16%, transparent 24% 52%, rgba(255,240,150,.45) 60%, transparent 70% 100%);
    -webkit-mask: radial-gradient(closest-side, transparent 62%, #000 76%, #000 86%, transparent 100%);
            mask: radial-gradient(closest-side, transparent 62%, #000 76%, #000 86%, transparent 100%);
    mix-blend-mode: screen; filter: blur(6px);
    animation: gira 7s linear infinite;
    opacity: .75;
  }
  @keyframes gira { to { transform: translate(-50%, -50%) rotate(360deg); } }

  /* Aura que late detrás del dragón */
  .aura {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 22% 50% at 50% 45%, rgba(255,230,120,.38), transparent 70%);
    mix-blend-mode: screen;
    animation: late 3.2s ease-in-out infinite;
  }
  @keyframes late { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }

  /* Destello de luz que cruza la imagen */
  .barrido {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.35) 50%, transparent 60%);
    background-size: 300% 100%;
    mix-blend-mode: soft-light;
    animation: barre 7s ease-in-out infinite;
  }
  @keyframes barre { 0% { background-position: 150% 0; } 60%, 100% { background-position: -50% 0; } }

  /* Ojos de Shenlong */
  .ojo {
    position: absolute; width: 2.2%; aspect-ratio: 1; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,255,255,.95) 0 10%, rgba(255,40,30,.95) 25%, rgba(255,0,0,.35) 55%, transparent 72%);
    mix-blend-mode: screen; opacity: 0;
    animation: mirada 6s ease-in-out infinite;
  }
  @keyframes mirada { 0%, 70%, 100% { opacity: 0; } 78%, 88% { opacity: .85; } }
  body.dragon .ojo { animation: ojoFuego 1.1s ease-in-out infinite; width: 3.4%; }
  @keyframes ojoFuego { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }

  /* Neblina que se mueve por las nubes de abajo */
  .niebla {
    position: absolute; left: -50%; right: -50%; bottom: -4%; height: 26%;
    background:
      radial-gradient(ellipse 12% 50% at 10% 70%, rgba(255,255,255,.7), transparent 70%),
      radial-gradient(ellipse 15% 45% at 35% 80%, rgba(255,255,255,.6), transparent 70%),
      radial-gradient(ellipse 13% 50% at 62% 75%, rgba(255,255,255,.7), transparent 70%),
      radial-gradient(ellipse 14% 45% at 88% 82%, rgba(255,255,255,.6), transparent 70%);
    filter: blur(8px);
    animation: deriva 40s linear infinite alternate;
    pointer-events: none;
  }
  @keyframes deriva { from { transform: translateX(-12%); } to { transform: translateX(12%); } }

  canvas#chispas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* ---------- Final: invocación de Shenlong ----------
     ritual: empieza el final (se van los carteles y el contador)
     oscuro: el cielo se pone negro
     dragon: aparece Shenlong recortado sobre el negro
     ruge:   tiembla la pantalla y caen rayos */
  .negro { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity 1.5s; pointer-events: none; }
  #dragon { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 2.2s; pointer-events: none; }
  .relleno, .niebla, .barrido, #slots, .contador, .titulo-cel { transition: opacity 1.2s; }
  .aura, .energia { transition: filter 1.5s; }
  body.ritual { background: #000; }
  body.ritual .relleno, body.ritual #slots, body.ritual .contador, body.ritual .titulo-cel, body.ritual .aviso { opacity: 0; }
  body.oscuro .negro { opacity: 1; }
  body.oscuro .niebla, body.oscuro .barrido { opacity: 0; }
  body.oscuro:not(.dragon) .aura { filter: opacity(0); }
  body.oscuro:not(.dragon) .energia { filter: blur(6px) opacity(0); }
  body.dragon #dragon { opacity: 1; }
  body.dragon .aura { background: radial-gradient(ellipse 27% 58% at 50% 45%, rgba(140,255,160,.45), transparent 72%); animation-duration: 1.6s; }
  body.dragon .energia { animation-duration: 2.4s; opacity: 1; }

  /* Copias de las esferas que vuelan durante el final */
  #vuelo { position: absolute; inset: 0; pointer-events: none; }
  .vuela {
    position: absolute; border-radius: 50%; display: none;
    background-image: url(/img/fondo.jpg?v=hd1); background-repeat: no-repeat;
    box-shadow: 0 0 1.4cqw .4cqw rgba(255,200,70,.8);
    transform: translate(-50%, -50%);
  }
  body.ritual .vuela { display: block; }
  .nucleo {
    position: absolute; width: 22%; aspect-ratio: 1; border-radius: 50%; opacity: 0;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,255,220,.95), rgba(255,200,60,.55) 30%, rgba(120,255,150,.18) 55%, transparent 70%);
    mix-blend-mode: screen;
  }

  .rayo { position: absolute; inset: 0; background: #e6fff0; opacity: 0; pointer-events: none; }
  body.ruge .rayo { animation: rayo 6s 1; }
  @keyframes rayo { 0%,100%{opacity:0} 4%{opacity:.85} 6%{opacity:0} 9%{opacity:.6} 12%{opacity:0} 50%{opacity:0} 52%{opacity:.5} 55%{opacity:0} }

  /* ---------- Esferas y recuadros ---------- */
  .tapa {
    position: absolute; border-radius: 50%; transform: translate(-50%, -50%) scale(1.07);
    -webkit-backdrop-filter: grayscale(1) brightness(.5) contrast(.9);
            backdrop-filter: grayscale(1) brightness(.5) contrast(.9);
    box-shadow: inset 0 0 .8cqw rgba(0,0,0,.55);
    transition: opacity .6s, transform .9s cubic-bezier(.3,1.6,.5,1);
  }
  .slot.llena .tapa { display: none; }

  /* Esfera "viva": copia recortada de la esfera de la imagen que late y se balancea */
  .bola-viva {
    position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
    background-image: url(/img/fondo.jpg?v=hd1); background-repeat: no-repeat;
    display: none; pointer-events: none;
  }
  .bola-viva::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.75), transparent 32%);
    mix-blend-mode: screen; animation: reflejo 2.6s ease-in-out infinite; animation-delay: inherit;
  }
  .slot.llena .bola-viva { display: block; animation: viva 2.6s ease-in-out infinite; animation-delay: var(--d); }
  .slot.nueva .bola-viva { animation: nace 1s cubic-bezier(.2,1.7,.4,1), viva 2.6s ease-in-out 1s infinite; }
  @keyframes viva {
    0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); filter: brightness(1) saturate(1); }
    25% { transform: translate(-50%, -52%) scale(1.07) rotate(-7deg); filter: brightness(1.18) saturate(1.2); }
    50% { transform: translate(-50%, -50%) scale(1.02) rotate(0deg); filter: brightness(1.05) saturate(1.1); }
    75% { transform: translate(-50%, -52%) scale(1.07) rotate(7deg); filter: brightness(1.18) saturate(1.2); }
  }
  @keyframes nace {
    from { transform: translate(-50%, -50%) scale(.2) rotate(-200deg); filter: brightness(2.5); }
    to { transform: translate(-50%, -50%) scale(1) rotate(0deg); filter: brightness(1); }
  }
  @keyframes reflejo { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
  .slot.nueva .bola-flash {
    position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,255,230,1), rgba(255,200,60,.6) 45%, transparent 70%);
    animation: flash 1.2s ease-out forwards; pointer-events: none;
  }
  @keyframes flash { from { opacity: 1; transform: translate(-50%, -50%) scale(.6); } to { opacity: 0; transform: translate(-50%, -50%) scale(2.2); } }

  .halo {
    position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
    box-shadow: 0 0 1.2cqw .5cqw rgba(255,190,40,.85);
    opacity: 0; pointer-events: none;
  }
  .slot.llena .halo { opacity: 1; animation: halo 2.4s ease-in-out infinite; animation-delay: var(--d); }
  @keyframes halo { 0%,100% { box-shadow: 0 0 .8cqw .2cqw rgba(255,190,40,.7); } 50% { box-shadow: 0 0 1.8cqw .6cqw rgba(255,210,70,.95); } }
  .slot.nueva .halo { animation: estallido 1.1s ease-out 3; }
  @keyframes estallido { 0% { box-shadow: 0 0 0 0 rgba(255,230,120,1); } 100% { box-shadow: 0 0 0 3cqw rgba(255,200,0,0); } }

  .caja {
    position: absolute; display: grid; place-items: center; text-align: center;
    padding: .2cqw .4cqw; line-height: 1.02;
    font-family: "Bangers", Impact, sans-serif; letter-spacing: .06cqw;
    font-size: 1.75cqw; color: #c64a00;
    text-shadow: .07cqw .07cqw 0 #ffd56b;
    overflow: hidden; word-break: break-word;
    /* cartel propio: solo se ve cuando la esfera fue escaneada */
    background: linear-gradient(180deg, #ffffff, #fff6e0);
    border: .18cqw solid #e07800; border-radius: .6cqw;
    box-shadow: 0 0 0 .15cqw #ffc94a, 0 0 1cqw .2cqw rgba(255,190,40,.85), inset 0 0 .5cqw rgba(224,120,0,.25);
    opacity: 0; transform: scale(0);
  }
  .caja.m { font-size: 1.45cqw; }
  .caja.s { font-size: 1.15cqw; }
  .slot.llena .caja { opacity: 1; transform: scale(1); }
  .slot.nueva .caja { animation: pop .8s cubic-bezier(.2,1.8,.4,1); }
  @keyframes pop { from { transform: scale(0) rotate(-8deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }

  .contador {
    position: fixed; right: 2vmin; bottom: 2.5vmin; z-index: 6;
    font-family: "Bangers", Impact, sans-serif; font-size: 5vmin; letter-spacing: .2vmin;
    color: var(--oro); -webkit-text-stroke: .2vmin #8a3000;
    background: rgba(10,25,60,.65); border: .4vmin solid rgba(255,210,63,.7);
    padding: .5vmin 2.6vmin; border-radius: 4vmin;
    box-shadow: 0 .8vmin 3vmin rgba(0,0,0,.4);
  }

  /* Aviso de esfera nueva */
  .aviso {
    position: fixed; left: 50%; top: 3vh; z-index: 8;
    transform: translate(-50%, -150%); opacity: 0;
    background: linear-gradient(135deg, #ff9d00, #ff5e00);
    color: #fff; font-weight: 900; font-size: 4.2vmin;
    padding: 1.6vmin 4.5vmin; border-radius: 6vmin; border: .5vmin solid #fff3b0;
    box-shadow: 0 1vmin 4vmin rgba(255,100,0,.6);
    transition: transform .6s cubic-bezier(.3,1.5,.5,1), opacity .4s; text-align: center; max-width: 80%;
  }
  .aviso.ver { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Mensaje final de Shenlong (abajo, el dragón queda arriba) ---------- */
  #final {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: end center; padding: 2.5vmin 16px;
    opacity: 0; pointer-events: none; transition: opacity 1.2s;
  }
  #final.ver { opacity: 1; pointer-events: auto; }
  .carta {
    width: min(1100px, 100%);
    display: grid; grid-template-columns: auto 1fr; gap: 3.5vmin; align-items: center;
    background: linear-gradient(160deg, rgba(10,45,22,.95), rgba(4,18,10,.95));
    border: .5vmin solid var(--verde);
    border-radius: 4vmin; padding: 2.8vmin 4vmin;
    box-shadow: 0 0 8vmin rgba(47,191,74,.6), inset 0 0 6vmin rgba(47,191,74,.15);
    transform: scale(.85); transition: transform 1.2s cubic-bezier(.2,1.4,.4,1);
  }
  #final.ver .carta { transform: scale(1); }
  .foto {
    width: 20vmin; height: 20vmin; border-radius: 50%;
    border: .8vmin solid var(--oro); box-shadow: 0 0 4vmin rgba(255,180,0,.6);
    object-fit: cover; background: #1d2b55;
    display: grid; place-items: center;
    font-family: "Bangers", Impact, sans-serif; font-size: 10vmin; color: var(--oro);
  }
  .habla { font-family: "Bangers", Impact, sans-serif; font-size: 3vmin; letter-spacing: .3vmin; color: #7dff9a; margin-bottom: 1.2vmin; }
  #texto { font-size: 3.6vmin; line-height: 1.35; font-weight: 900; min-height: 4.1em; }
  #texto b { color: var(--oro); }
  #texto .cursor { display: inline-block; width: .5em; animation: parpadea .8s steps(1) infinite; }
  @keyframes parpadea { 50% { opacity: 0; } }
  .equipo { margin-top: 1.5vmin; font-size: 2.1vmin; opacity: .85; }
  @media (max-aspect-ratio: 1/1) {
    .carta { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 2vmin; }
    #texto { min-height: 0; font-size: max(16px, 4.6vmin); }
    .habla { font-size: max(14px, 3.6vmin); }
    .equipo { font-size: max(12px, 3vmin); }
  }

  .pantalla-completa {
    position: fixed; right: 12px; top: 12px; z-index: 20;
    font: 900 14px "Nunito", sans-serif; color: #fff; cursor: pointer;
    background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.35); border-radius: 10px; padding: 8px 12px;
  }
  .bola-flash { display: none; }
  .slot.nueva .bola-flash { display: block; }
  .pantalla-completa {
    opacity: 0; transition: opacity .3s;
  }
  body:hover .pantalla-completa { opacity: 1; }
  :fullscreen .pantalla-completa { display: none; }

  .musica-btn {
    position: fixed; left: 12px; top: 12px; z-index: 30;
    width: 40px; height: 40px; padding: 0; cursor: pointer;
    font-size: 20px; line-height: 40px; text-align: center;
    background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.35); border-radius: 50%;
    opacity: .7;
  }
  .musica-btn[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .vivo, .energia, .barrido, .niebla { animation: none !important; }
  }
</style>
</head>
<body>
<div class="relleno"></div>

<div class="marco">
  <div class="escena" id="escena">
    <div class="vivo">
      <img class="fondo" src="/img/fondo.jpg?v=hd1" alt="Shenlong y las 7 Esferas del Dragón - Arian, mi primer añito" draggable="false">
      <div class="negro"></div>
      <canvas id="dragon"></canvas>
      <div class="aura"></div>
      <div class="energia"></div>
      <div class="barrido"></div>
      <div class="ojo" style="left:47.66%; top:21.66%"></div>
      <div class="ojo" style="left:50%; top:20.74%"></div>
      <div id="slots"></div>
      <div id="vuelo"><div class="nucleo" id="nucleo"></div></div>
      <div class="niebla"></div>
      <canvas id="chispas"></canvas>
      <div class="rayo"></div>
    </div>
  </div>
</div>
<div class="titulo-cel">¡Encontrá las 7 esferas!<small>Escaneá los códigos QR y despertá a Shenlong</small></div>
<div class="contador" id="contador">0 / 7</div>
<div class="aviso" id="aviso"></div>

<button class="pantalla-completa" id="fs">⛶ Pantalla completa</button>

<audio id="musica" src="/mp3/audio.mp3" loop autoplay preload="auto"></audio>
<button class="musica-btn" id="musicaBtn" title="Tocá la pantalla para activar la música" aria-label="Activar música" hidden>🔇</button>

<div id="final" aria-live="polite">
  <div class="carta">
    <div class="foto" data-foto>A</div>
    <div>
      <div class="habla">Shenlong dice:</div>
      <div id="texto"></div>
      <div class="equipo" id="equipo"></div>
    </div>
  </div>
</div>

<script>
  // Posiciones medidas sobre la imagen original de 1024 x 434 px: [x centro, y centro, radio]
  const W = 1024, H = 434;
  const BOLAS = {
    1: [367, 80, 29],
    2: [665, 81, 29],
    3: [376, 195, 29],
    4: [515, 212, 29],
    5: [656, 195, 29],
    6: [428, 305, 32],
    7: [606, 307, 30],
  };
  // El cartel con el nombre va justo debajo de cada esfera
  const ANCHO_CARTEL = 96, ALTO_CARTEL = 28, SEPARACION = 5;
  // Corrimiento horizontal de algunos carteles para no tapar el logo de ARIAN
  const CORRER = { 6: -28, 7: 36 };
  const ESFERAS = {};
  for (const [n, [x, y, r]] of Object.entries(BOLAS)) {
    const y1 = y + r + SEPARACION;
    const cx = x + (CORRER[n] || 0);
    ESFERAS[n] = { bola: [x, y, r], caja: [cx - ANCHO_CARTEL / 2, y1, cx + ANCHO_CARTEL / 2, y1 + ALTO_CARTEL] };
  }
  const pct = (v, total) => (v / total * 100) + "%";

  // ---------- armar casilleros ----------
  const slots = document.getElementById("slots");
  const vuelo = document.getElementById("vuelo");
  for (let n = 1; n <= 7; n++) {
    const { bola: [x, y, r], caja: [x1, y1, x2, y2] } = ESFERAS[n];
    const s = document.createElement("div");
    s.className = "slot"; s.id = "s" + n;
    const circ = `left:${pct(x, W)};top:${pct(y, H)};width:${pct(2 * r, W)};height:${pct(2 * r, H)}`;
    // recorte de la esfera pintada en la imagen de fondo
    const recorte =
      `background-size:${(W / (2 * r) * 100).toFixed(2)}% ${(H / (2 * r) * 100).toFixed(2)}%;` +
      `background-position:${((x - r) / (W - 2 * r) * 100).toFixed(3)}% ${((y - r) / (H - 2 * r) * 100).toFixed(3)}%`;
    s.innerHTML =
      `<div class="halo" style="${circ};--d:${(n * .3).toFixed(1)}s"></div>` +
      `<div class="tapa" style="${circ}"></div>` +
      `<div class="bola-viva" style="${circ};--d:${(n * .37).toFixed(2)}s;${recorte}"></div>` +
      `<div class="bola-flash" style="${circ}"></div>` +
      `<div class="caja" style="left:${pct(x1, W)};top:${pct(y1, H)};width:${pct(x2 - x1, W)};height:${pct(y2 - y1, H)}"><span></span></div>`;
    slots.appendChild(s);
    // copia que vuela en el final
    const v = document.createElement("div");
    v.className = "vuela"; v.id = "v" + n;
    v.style.cssText = `${circ};${recorte}`;
    vuelo.appendChild(v);
  }

  // ---------- chispas doradas ----------
  const cv = document.getElementById("chispas");
  const ctx = cv.getContext("2d");
  let parts = [];
  let invocado = false;
  function medir() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2, 2400 / Math.max(1, r.width));
    cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
  }
  window.addEventListener("resize", medir); medir();

  function chispa(x, y, opts = {}) {
    const ang = opts.ang ?? Math.random() * Math.PI * 2;
    const vel = opts.vel ?? 0;
    parts.push({
      x, y,
      vx: Math.cos(ang) * vel + (Math.random() - .5) * .0004,
      vy: Math.sin(ang) * vel - (opts.sube ?? .0006) * (0.5 + Math.random()),
      r: (opts.r ?? 1.5) * (0.6 + Math.random()),
      vida: 1, dec: opts.dec ?? (0.003 + Math.random() * 0.004),
      color: opts.color || (Math.random() < .7 ? "255,215,90" : "255,255,220"),
    });
  }
  function explosion(n) {
    const [x, y] = ESFERAS[n].bola;
    for (let i = 0; i < 90; i++) chispa(x / W, y / H, { vel: 0.002 + Math.random() * 0.006, sube: 0, r: 2.4, dec: 0.012 + Math.random() * 0.01 });
  }
  function anim() {
    const w = cv.width, h = cv.height, k = w / 1800;
    ctx.clearRect(0, 0, w, h);
    // chispas ambientales que suben desde el dragón
    const cuantas = invocado ? 4 : 1;
    for (let i = 0; i < cuantas; i++) {
      if (Math.random() < .55) chispa(.3 + Math.random() * .4, .15 + Math.random() * .75, invocado ? { color: Math.random() < .5 ? "150,255,170" : "255,230,120", r: 2 } : {});
    }
    ctx.globalCompositeOperation = "lighter";
    parts = parts.filter((p) => p.vida > 0);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vx *= .985; p.vy *= .985; p.vida -= p.dec;
      const a = Math.max(0, p.vida) * (0.6 + 0.4 * Math.sin(p.vida * 30));
      const g = ctx.createRadialGradient(p.x * w, p.y * h, 0, p.x * w, p.y * h, p.r * 4 * k);
      g.addColorStop(0, `rgba(${p.color},${a})`);
      g.addColorStop(1, `rgba(${p.color},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x * w, p.y * h, p.r * 4 * k, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);

  // ---------- foto de Arian (img/arian.jpg | .png | .jpeg | .webp) ----------
  (function () {
    const opciones = ["/img/arian.jpg", "/img/arian.png", "/img/arian.jpeg", "/img/arian.webp"];
    (function probar(i) {
      if (i >= opciones.length) return;
      const img = new Image();
      img.onload = () => document.querySelectorAll("[data-foto]").forEach((el) => {
        const copia = document.createElement("img");
        copia.src = img.src; copia.alt = "Arian"; copia.className = el.className;
        el.replaceWith(copia);
      });
      img.onerror = () => probar(i + 1);
      img.src = opciones[i];
    })(0);
  })();

  // ---------- música en bucle ----------
  // Los navegadores bloquean el audio automático hasta que el usuario toca la
  // página: si pasa eso, se muestra un botón y arranca con el primer clic o tecla.
  (function () {
    const audio = document.getElementById("musica");
    const btn = document.getElementById("musicaBtn");
    audio.volume = 0.8;
    function tocar() {
      const p = audio.play();
      if (p && p.then) p.then(() => { btn.hidden = true; }).catch(() => { btn.hidden = false; });
    }
    ["pointerdown", "keydown", "touchstart"].forEach((ev) => document.addEventListener(ev, () => { if (audio.paused) tocar(); }));
    // por si se corta (pestaña en segundo plano, error de red), reintentar
    audio.addEventListener("pause", () => setTimeout(() => { if (audio.paused) tocar(); }, 500));
    audio.addEventListener("ended", () => { audio.currentTime = 0; tocar(); });
    audio.addEventListener("error", () => setTimeout(() => { audio.load(); tocar(); }, 3000));
    document.addEventListener("visibilitychange", () => { if (!document.hidden && audio.paused) tocar(); });
    tocar();
  })();

  // ---------- pantalla completa ----------
  document.getElementById("fs").onclick = () => document.documentElement.requestFullscreen?.();

  // ---------- estado ----------
  let previo = null;
  let mostrado = false;

  function aviso(txt) {
    const a = document.getElementById("aviso");
    a.textContent = txt;
    a.classList.add("ver");
    clearTimeout(aviso.t);
    aviso.t = setTimeout(() => a.classList.remove("ver"), 5000);
  }

  function tamano(nombre) {
    const l = nombre.length;
    return l <= 9 ? "" : l <= 14 ? "m" : "s";
  }

  function pintar(est) {
    const esferas = est.esferas || {};
    for (let n = 1; n <= 7; n++) {
      const s = document.getElementById("s" + n);
      const caja = s.querySelector(".caja");
      const e = esferas[n];
      if (e && !s.classList.contains("llena")) {
        s.classList.add("llena");
        caja.className = "caja " + tamano(e.nombre);
        caja.innerHTML = "<span></span>";
        caja.firstChild.textContent = e.nombre;
        if (previo) {
          s.classList.add("nueva");
          setTimeout(() => s.classList.remove("nueva"), 3500);
          explosion(n);
          aviso(`¡${e.nombre} encontró la esfera de ${n} estrella${n > 1 ? "s" : ""}!`);
        }
      } else if (!e && s.classList.contains("llena")) {
        s.classList.remove("llena");
        caja.className = "caja";
        caja.innerHTML = "<span></span>";
      }
    }
    document.getElementById("contador").textContent = Object.keys(esferas).length + " / 7";

    if (est.completo && !mostrado) {
      mostrado = true;
      invocar(est, !!previo);
    } else if (!est.completo && mostrado) {
      mostrado = false;
      reiniciarFinal();
    }
    previo = est;
  }

  // ================= FINAL DEL JUEGO =================
  // Gana quien entrega la ÚLTIMA esfera (est.ultimo).
  // Secuencia (segundos desde que empieza el ritual):
  //   0     el cielo se pone negro (las esferas siguen brillando)
  //   1.5   las 7 esferas vuelan al centro y se juntan girando
  //   4.5   aparece Shenlong sobre el negro (tiembla, rayos, ojos rojos)
  //   7.5   las esferas suben girando cada vez más rápido
  //   8.7   salen disparadas cada una para su lado
  //   10.6  queda el dragón solo y aparece el nombre del ganador
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ESPERA = 2.5;          // tiempo para ver la última esfera llegar antes del ritual
  const cuerpo = document.body.classList;
  const relojes = [];
  const luego = (seg, fn) => relojes.push(setTimeout(fn, seg * 1000));
  let vueloT0 = null;

  function invocar(est, animado) {
    prepararDragon();
    const nombre = esc(est.ultimo || "");
    const FRASE =
      `¡<b>${nombre}</b>!` +
      ` Buenas tardes, <b>${nombre}</b>.` +
      ` Lograste cumplir el desafío.` +
      ` Tu premio será entregado al finalizar el cumpleaños.` +
      ` ¡Que lo disfruten!`;
    const lista = Object.values(est.esferas).sort((a, b) => a.hora - b.hora).map((e) => esc(e.nombre));
    document.getElementById("equipo").innerHTML = "Esferas reunidas por: " + [...new Set(lista)].join(" · ");
    const texto = document.getElementById("texto");
    texto.textContent = "";

    if (!animado) {
      // la pantalla se abrió con el juego ya terminado: directo al final
      invocado = true;
      cuerpo.add("ritual", "oscuro", "dragon");
      document.querySelectorAll(".vuela").forEach((b) => (b.style.display = "none"));
      document.getElementById("final").classList.add("ver");
      escribir(texto, FRASE, 0);
      return;
    }
    luego(ESPERA, () => {
      cuerpo.add("ritual", "oscuro");
      vueloT0 = performance.now();
      requestAnimationFrame(volar);
    });
    luego(ESPERA + 4.5, () => {
      cuerpo.add("dragon", "ruge");
      invocado = true;
      for (let i = 0; i < 160; i++) chispa(.5, .46, { vel: .002 + Math.random() * .008, sube: 0, r: 2.6, dec: .008 + Math.random() * .01, color: Math.random() < .5 ? "150,255,170" : "255,230,120" });
    });
    luego(ESPERA + 8, () => cuerpo.remove("ruge"));
    luego(ESPERA + 10.2, () => cuerpo.add("ruge"));
    luego(ESPERA + 10.6, () => {
      document.getElementById("final").classList.add("ver");
      escribir(texto, FRASE, 45);
    });
    luego(ESPERA + 14, () => cuerpo.remove("ruge"));
  }

  function reiniciarFinal() {
    relojes.forEach(clearTimeout); relojes.length = 0;
    vueloT0 = null; invocado = false;
    cuerpo.remove("ritual", "oscuro", "dragon", "ruge");
    document.getElementById("final").classList.remove("ver");
    document.querySelectorAll(".vuela").forEach((b) => (b.style.display = ""));
    document.getElementById("nucleo").style.opacity = 0;
  }

  // ---------- vuelo de las esferas ----------
  const suave = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u));
  const giroEn = (t) => 0.5 * t + 0.12 * t * t;      // el anillo gira cada vez más rápido
  const SALIDA = 8.7, DURA_SALIDA = 1.6;

  function volar(ahora) {
    if (vueloT0 === null) return;
    const t = (ahora - vueloT0) / 1000;
    const sube = suave((Math.min(t, SALIDA) - 7.5) / 1.2);
    const cx = 512, cy = 200 - 70 * sube;            // centro del anillo (frente al dragón)
    const R = 42 - 10 * sube;                        // radio del anillo
    const junta = suave((t - 1.5) / 1.8);            // 0 = en su lugar, 1 = juntas
    const u = (t - SALIDA) / DURA_SALIDA;            // > 0: salen disparadas
    let quedan = 0;

    for (let n = 1; n <= 7; n++) {
      const el = document.getElementById("v" + n);
      if (el.style.display === "none") continue;
      const [x0, y0] = BOLAS[n];
      const base = -Math.PI / 2 + (n - 1) * 2 * Math.PI / 7;
      const ang = base + giroEn(Math.min(t, SALIDA));
      let x = cx + R * Math.cos(ang), y = cy + R * Math.sin(ang);
      let tam = 1 + (.72 - 1) * junta;
      let brillo = 1.1 + .3 * junta * (1 + Math.sin(t * 7 + n)) / 2 + .5 * sube;
      if (junta < 1) { x = x0 + (x - x0) * junta; y = y0 + (y - y0) * junta; }
      if (u > 0) {
        // cada una sale en línea recta hacia afuera, acelerando, y deja una estela
        const d = 1100 * u * u;
        x += d * Math.cos(ang); y += d * Math.sin(ang);
        tam = .72 * (1 - .55 * Math.min(u, 1));
        brillo = 1.6 + 2 * u;
        for (let k = 0; k < 3; k++) chispa(x / W, y / H, { vel: 0, sube: 0, r: 2.4 - u, dec: .02 + Math.random() * .015 });
        if (u >= 1) { el.style.display = "none"; continue; }
      } else if (junta > .9 && Math.random() < .5) {
        chispa(x / W, y / H, { vel: .001 + Math.random() * .002, sube: .0008, r: 1.8, dec: .015 });
      }
      quedan++;
      el.style.left = pct(x, W); el.style.top = pct(y, H);
      el.style.transform = `translate(-50%, -50%) scale(${tam.toFixed(3)}) rotate(${(giroEn(t) * 57).toFixed(1)}deg)`;
      el.style.filter = `brightness(${brillo.toFixed(2)})`;
    }

    // luz en el medio del anillo mientras están juntas
    const luz = suave((t - 2.8) / 1) * (1 - suave(u * 3)) * (.75 + .25 * Math.sin(t * 9));
    const nuc = document.getElementById("nucleo");
    nuc.style.left = pct(cx, W); nuc.style.top = pct(cy, H);
    nuc.style.opacity = luz.toFixed(3);

    if (quedan || luz > 0.01) requestAnimationFrame(volar);
  }

  // ---------- Shenlong recortado ----------
  // Si existe img/dragon.png (o .jpg): la misma imagen que fondo.jpg pero SIN
  // las esferas, se usa esa y el dragón queda limpio. Si no, se usa fondo.jpg
  // y las esferas pintadas se tapan con manchas de luz.
  // De la imagen deja solo lo verde/dorado (el dragón y su energía), borra el
  // cielo y lo dibuja con un brillo verde.
  let dragonListo = false;
  function prepararDragon() {
    if (dragonListo) return;
    dragonListo = true;
    (function probar(lista) {
      if (!lista.length) {
        const img = document.querySelector("img.fondo");
        if (img.complete && img.naturalWidth) recortarDragon(img, false);
        else img.addEventListener("load", () => recortarDragon(img, false), { once: true });
        return;
      }
      const im = new Image();
      im.onload = () => recortarDragon(im, true);
      im.onerror = () => probar(lista.slice(1));
      im.src = lista[0];
    })(["/img/dragon.png", "/img/dragon.jpg"]);
  }

  function recortarDragon(img, limpio) {
    const w = img.naturalWidth, h = img.naturalHeight, sx = w / W, sy = h / H;
    const tmp = document.createElement("canvas");
    tmp.width = w; tmp.height = h;
    const t = tmp.getContext("2d", { willReadFrequently: true });
    t.drawImage(img, 0, 0);
    try {
      const datos = t.getImageData(0, 0, w, h), d = datos.data;
      const cx = 512 * sx, cy = 165 * sy, rx = 212 * sx, ryArriba = 215 * sy, ryAbajo = 165 * sy;
      for (let y = 0; y < h; y++) {
        const ey = (y - cy) / (y < cy ? ryArriba : ryAbajo);
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          const r = d[i], g = d[i + 1], b = d[i + 2];
          let a = ((Math.max(r, g) - b) / 255 - .1) / .2;        // verde/dorado sí; cielo y nubes no
          if (a > 0) {
            const ex = (x - cx) / rx;
            a = Math.min(a, 1) * Math.min(1, Math.max(0, (1 - Math.sqrt(ex * ex + ey * ey)) / .2));
            if (y > 200 * sy && x < 345 * sx) a *= Math.max(0, (x - 325 * sx) / (20 * sx));   // montaña de la izquierda
          }
          d[i + 3] = a > 0 ? a * d[i + 3] : 0;
        }
      }
      // tapar las esferas pintadas (y su brillo) con lo que las rodea
      if (!limpio) for (const [x, y, r] of Object.values(BOLAS)) rellenar(d, w, h, x * sx, y * sy, r * sx * 1.3);
      t.putImageData(datos, 0, 0);
    } catch (e) {
      // si el navegador no deja leer la imagen, se muestra el dragón sin recortar
    }
    const cv = document.getElementById("dragon");
    cv.width = w; cv.height = h;
    const c = cv.getContext("2d");
    c.shadowColor = "rgba(120,255,150,.85)";
    c.shadowBlur = 14 * sx;
    c.drawImage(tmp, 0, 0);
  }

  // Tapa un círculo de la imagen: cada píxel de adentro toma una mezcla de los
  // colores del borde del círculo, pesando más los que tiene más cerca.
  function rellenar(d, w, h, hx, hy, R) {
    const N = 160, borde = [];
    for (let k = 0; k < N; k++) {
      const an = k / N * Math.PI * 2;
      const bx = Math.round(hx + (R + 2) * Math.cos(an)), by = Math.round(hy + (R + 2) * Math.sin(an));
      if (bx < 0 || by < 0 || bx >= w || by >= h) continue;
      const i = (by * w + bx) * 4, a = d[i + 3];
      borde.push([bx, by, d[i] * a, d[i + 1] * a, d[i + 2] * a, a]);
    }
    const x0 = Math.max(0, Math.floor(hx - R)), x1 = Math.min(w - 1, Math.ceil(hx + R));
    const y0 = Math.max(0, Math.floor(hy - R)), y1 = Math.min(h - 1, Math.ceil(hy + R));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      if (Math.hypot(x - hx, y - hy) >= R) continue;
      let sr = 0, sg = 0, sb = 0, sa = 0, sw = 0;
      for (const [bx, by, r, g, b, a] of borde) {
        const dx = x - bx, dy = y - by, p = 1 / (dx * dx + dy * dy);
        sr += r * p; sg += g * p; sb += b * p; sa += a * p; sw += p;
      }
      const i = (y * w + x) * 4;
      if (sa > 0) { d[i] = sr / sa; d[i + 1] = sg / sa; d[i + 2] = sb / sa; }
      d[i + 3] = sa / sw;
    }
  }

  // efecto máquina de escribir respetando las etiquetas <b>
  function escribir(el, html, vel) {
    if (!vel) { el.innerHTML = html; return; }
    let i = 0;
    (function paso() {
      if (i > html.length) { el.innerHTML = html; return; }
      if (html[i] === "<") i = html.indexOf(">", i) + 1;
      else if (html[i] === "&") i = html.indexOf(";", i) + 1;
      else i++;
      el.innerHTML = html.slice(0, i) + '<span class="cursor">▌</span>';
      setTimeout(paso, vel);
    })();
  }

  async function actualizar() {
    try {
      const r = await fetch("/api/estado", { cache: "no-store" });
      if (r.ok) pintar(await r.json());
    } catch (e) { /* servidor caído momentáneamente */ }
  }

  // el recorte del dragón se prepara al cargar, para que el final no se trabe
  setTimeout(prepararDragon, 1500);

  // Modo demostración: /?demo simula el juego entero (sin tocar el servidor)
  // y /?demo=final muestra directamente la pantalla final.
  const demo = new URLSearchParams(location.search).get("demo");
  if (demo !== null) {
    const nombres = ["Daniel", "Sofía", "Daniel", "Martina", "Daniel", "Daniel", "Juan"];
    const orden = [3, 1, 6, 2, 5, 7, 4];
    const est = { esferas: {}, ultimo: null, completo: false };
    const entregar = (i) => {
      est.esferas[orden[i]] = { nombre: nombres[i], hora: i };
      if (i === 6) { est.ultimo = nombres[i]; est.completo = true; }
    };
    if (demo === "final") { orden.forEach((_, i) => entregar(i)); pintar(est); }
    else {
      pintar(est);
      orden.forEach((_, i) => setTimeout(() => { entregar(i); pintar(est); }, 1500 + i * 1200));
    }
  } else {
    actualizar();
    setInterval(actualizar, 2000);
  }
</script>
</body>
